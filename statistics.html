<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Statistics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
        integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/statistics.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg nav1">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="logo.png" alt="Logo" width="120">
            </a>
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav mx-5">
                    <li class="nav-item"><a class="nav-link me-3 fw-bold text-light" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link me-3 fw-bold text-light" href="matches.html">Matches</a>
                    </li>
                    <li class="nav-item"><a class="nav-link me-3 fw-bold text-light" href="table.html">Table</a></li>
                    <li class="nav-item"><a class="nav-link me-3 fw-bold active text-light" href="statistics.html">Statistics</a></li>
                </ul>

                <div class="d-flex ms-auto">
                    <button type="button" class="btn btn-outline-danger btn-nav fw-bold"> <span><i
                                class="fa-solid fa-circle"></i></span> Live</button>
                </div>
            </div>
        </div>
    </nav>

    <section class="container-fluid">
        <div class="row">
            <div class="col bg-danger line-br"></div>
            <div class="col bg-warning line-br"></div>
            <div class="col bg-success line-br"></div>
        </div>
    </section>

    <div class="container py-5">
        <h2 class="text-center mb-4">
            La Liga - Player Statistics
        </h2>

        <ul class="nav nav-tabs mb-4" id="statisticsTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="top-scorers-tab" data-bs-toggle="tab" data-bs-target="#top-scorers"
                    type="button" role="tab">
                    <i class="fas fa-futbol me-2"></i>Top Scorers
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="yellow-cards-tab" data-bs-toggle="tab" data-bs-target="#yellow-cards"
                    type="button" role="tab">
                    <i class="fas fa-square text-warning me-2"></i>Yellow Cards
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="red-cards-tab" data-bs-toggle="tab" data-bs-target="#red-cards"
                    type="button" role="tab">
                    <i class="fas fa-square text-danger me-2"></i>Red Cards
                </button>
            </li>
        </ul>

        <div class="tab-content" id="statisticsTabContent">

            <div class="tab-pane fade show active" id="top-scorers" role="tabpanel">
                <div class="row" id="top-scorers-container">
                    <div class="text-center py-5">
                        <div class="spinner-border text-light" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-3">Loading top scorers...</p>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="yellow-cards" role="tabpanel">
                <div class="row" id="yellow-cards-container">
                    <div class="text-center py-5">
                        <div class="spinner-border text-light" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-3">Loading yellow cards...</p>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="red-cards" role="tabpanel">
                <div class="row" id="red-cards-container">
                    <div class="text-center py-5">
                        <div class="spinner-border text-light" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-3">Loading red cards...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
    <script src="js/statistics.js"></script>
</body>

</html>
